[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "RailPolicy_RAG"
version = "0.1.0"
description = "A reproducible benchmark for domain-document retrieval augmented generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fangxu0221" }]
dependencies = []

[project.optional-dependencies]
collection = ["lxml>=5,<7"]
ui = ["streamlit>=1.37,<2"]
langgraph = ["langgraph>=1.2.20,<1.3"]
embedding = ["sentence-transformers>=3.0,<6"]
reranker = [
  "sentence-transformers[onnx]>=5.0,<6",
  "transformers>=4.41,<4.55",
]

[tool.setuptools.packages.find]
include = ["domainrag*"]
